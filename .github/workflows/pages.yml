# Test on every push and pull request; publish the game to GitHub Pages from main.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR test runs are cancelled; a deployment in progress is never interrupted.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # no dependencies and no lockfile, so there is nothing to cache
          package-manager-cache: false
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level ones, so contents: read is repeated
    # here; without it checkout cannot read a private repository.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Deploying through Actions skips Jekyll entirely, so no .nojekyll marker is needed
      # (upload-pages-artifact v4+ would drop dotfiles anyway).
      - name: Collect the playable files
        run: |
          mkdir -p _site
          cp -r index.html css src _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
